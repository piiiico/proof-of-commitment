name: Supply Chain Audit

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths:
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch: {}

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Commit Supply Chain Audit
        uses: piiiico/commit-action@v1
        with:
          fail-on-critical: false
          max-packages: '20'
          comment-on-pr: true
          include-dev-dependencies: false

      - name: Generate SARIF report
        if: always()
        run: npx -y proof-of-commitment --file package.json --sarif --fail-on=none > commit-results.sarif

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: commit-results.sarif
          category: commit-supply-chain
