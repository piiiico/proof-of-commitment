name: Publish to npm + MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-npm:
    name: Publish npm package with provenance
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for npm Trusted Publishing (OIDC) and provenance attestation

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check if version already published
        working-directory: ./npm-package
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          if npm view "proof-of-commitment@${VERSION}" version 2>/dev/null | grep -q "${VERSION}"; then
            echo "Version ${VERSION} already published on npm — skipping publish"
            echo "SKIP_PUBLISH=true" >> $GITHUB_ENV
          else
            echo "Version ${VERSION} not yet published — will publish"
            echo "SKIP_PUBLISH=false" >> $GITHUB_ENV
          fi

      - name: Funnel smoke gate
        # Blocks publish when any key funnel path is destination-broken.
        # Catches the same-class bug shipped in v1.20.0 (missing auth header → 0 conversions)
        # and v1.21.0 (silent allow on 429 → security gap + 0 conversions).
        # Runs a local mock backend so the check is deterministic in CI.
        # Paths tested:
        #   A: CLI audit with API key → 200 + results (auth-header regression, v1.20.1)
        #   B: CLI audit anonymous after RL → 429 + message + instant_key_url
        #   C: cursor-hook after RL → permission=ask + signup URL (silent-allow regression, v1.21.1)
        if: env.SKIP_PUBLISH == 'false'
        env:
          COMMIT_TEST_API_KEY: ${{ secrets.COMMIT_TEST_API_KEY }}
        run: bash scripts/funnel-smoke.sh

      - name: Verify npm auth (fail-fast on bad token)
        # Confirms WHICH npm user the token authenticates as and WHICH packages
        # that user can write. Fails fast with a clear message if the token is
        # invalid (401 whoami) or lacks write access to proof-of-commitment —
        # so we don't waste a publish attempt + get a misleading 404 downstream.
        # Never echoes the token value — only length + npm_ prefix presence.
        if: env.SKIP_PUBLISH == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +x

          echo "::group::Token shape (no value leaked)"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is empty — set it at: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Token length: ${#NODE_AUTH_TOKEN}"
          case "$NODE_AUTH_TOKEN" in
            npm_*) echo "Token type: granular or automation (npm_* prefix)" ;;
            *) echo "Token type: classic (no npm_ prefix)" ;;
          esac
          echo "::endgroup::"

          echo "::group::npm whoami (who does this token authenticate as?)"
          WHOAMI_OUT=$(npm whoami 2>&1) || WHOAMI_FAILED=1
          echo "$WHOAMI_OUT"
          echo "::endgroup::"

          if [ -n "$WHOAMI_FAILED" ]; then
            echo "::error::NPM_TOKEN is invalid (whoami returned non-200). Regenerate at https://www.npmjs.com/settings/<user>/tokens with publish permission on proof-of-commitment, then update the NPM_TOKEN repo secret."
            exit 1
          fi

          echo "::group::npm access list packages (which packages can this token write?)"
          ACCESS_OUT=$(npm access list packages 2>&1 | head -50) || true
          echo "$ACCESS_OUT"
          echo "::endgroup::"

          # Confirm the token can write proof-of-commitment specifically.
          # Output format: "proof-of-commitment: read-write" (or read-only).
          if ! echo "$ACCESS_OUT" | grep -qE "proof-of-commitment.*read-write"; then
            echo "::warning::Token does not show 'proof-of-commitment: read-write' — publish may 404. Verify the token's package scope and the user's maintainer role."
          fi

          echo "::group::Target package owners"
          npm owner ls proof-of-commitment 2>&1 || true
          echo "::endgroup::"

      - name: Copy LICENSE into npm-package
        if: env.SKIP_PUBLISH == 'false'
        run: cp LICENSE npm-package/LICENSE

      - name: Publish to npm
        if: env.SKIP_PUBLISH == 'false'
        working-directory: ./npm-package
        run: |
          # --provenance requires OIDC + granular token with provenance scope.
          # Automation tokens cause E404 when combined with --provenance.
          # Try with provenance first; fall back to plain publish.
          npm publish --provenance --access public 2>&1 || {
            echo "::warning::Provenance publish failed — retrying without --provenance"
            npm publish --access public
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-mcp-registry:
    name: Publish to MCP Registry
    if: always()  # Run even if npm publish fails (uses OIDC, not npm token)
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for GitHub OIDC auth with MCP Registry

    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Authenticate with MCP Registry
        run: mcp-publisher login github-oidc

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Publish to MCP Registry
        run: |
          OUTPUT=$(mcp-publisher publish 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            if echo "$OUTPUT" | grep -qi "duplicate version\|already published\|cannot publish duplicate"; then
              echo "Version already published to MCP Registry — skipping (not an error)"
              exit 0
            fi
            exit $EXIT_CODE
          fi
