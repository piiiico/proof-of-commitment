name: Publish to npm + MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-npm:
    name: Publish npm package with provenance
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for npm Trusted Publishing (OIDC) and provenance attestation

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check if version already published
        working-directory: ./npm-package
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          if npm view "proof-of-commitment@${VERSION}" version 2>/dev/null | grep -q "${VERSION}"; then
            echo "Version ${VERSION} already published on npm — skipping publish"
            echo "SKIP_PUBLISH=true" >> $GITHUB_ENV
          else
            echo "Version ${VERSION} not yet published — will publish"
            echo "SKIP_PUBLISH=false" >> $GITHUB_ENV
          fi

      - name: Publish with provenance
        if: env.SKIP_PUBLISH == 'false'
        working-directory: ./npm-package
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for GitHub OIDC auth with MCP Registry

    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Authenticate with MCP Registry
        run: mcp-publisher login github-oidc

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Publish to MCP Registry
        run: mcp-publisher publish
